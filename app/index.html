<title>国旗検定</title>
<meta name="description" content="世界197か国の国旗を、国旗あて・由来クイズ・場所あての3モードで覚える">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chivo+Mono:wght@500&display=swap">
<style>
/* レイアウト: 1カラムの「検定問題用紙」。上に進行バー、中央に問題、下に解答欄。場所あてだけ地図が画面を占める */
:root {
  --bg: #f3f5f9;          /* 用紙の地(わずかに青寄りのグレー) */
  --surface: #ffffff;
  --ink: #15203a;         /* 紺の墨 */
  --sub: #5a6680;
  --line: #d5dbe6;
  --accent: #1f4fbf;      /* 旗竿の金具のような紺青 */
  --accent-ink: #ffffff;
  --pick: #f2b705;        /* 信号旗の黄: 地図で選択中 */
  --ok: #1e8e5a;
  --ng: #d23b3b;
  --sea: #dbe5f1;
  --land: #ffffff;
  --land-off: #e7ebf2;
  --border: #9aa8bf;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  --flag-edge: drop-shadow(0 0 0.6px rgba(21, 32, 58, .55)) drop-shadow(0 1px 2px rgba(21, 32, 58, .12));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1320; --surface: #161f31; --ink: #e7ecf5; --sub: #9aa6bd; --line: #2a3650;
  --accent: #6f9bff; --accent-ink: #0d1320; --pick: #f5c435; --ok: #3cc488; --ng: #ff6b6b;
  --sea: #0f1a2c; --land: #2b3754; --land-off: #1d263a; --border: #51607f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1320; --surface: #161f31; --ink: #e7ecf5; --sub: #9aa6bd; --line: #2a3650;
  --accent: #6f9bff; --accent-ink: #0d1320; --pick: #f5c435; --ok: #3cc488; --ng: #ff6b6b;
  --sea: #0f1a2c; --land: #2b3754; --land-off: #1d263a; --border: #51607f; color-scheme: dark; }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
#app { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--sub); }
.small { font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---- ホーム */
.masthead { display: grid; gap: 4px; padding-block: 12px 4px; }
.masthead .eyebrow { font-size: 12px; letter-spacing: .18em; color: var(--sub); }
.masthead h1 { font-size: clamp(40px, 12vw, 64px); line-height: 1.05; }
.masthead p { margin: 0; color: var(--sub); }
.pole { display: flex; gap: 6px; align-items: flex-end; height: 34px; margin-top: 6px; overflow: hidden; }
.pole img { height: 22px; filter: var(--flag-edge); animation: wave 3.2s ease-in-out infinite; transform-origin: left center; }
.pole img:nth-child(2n) { animation-delay: -.8s } .pole img:nth-child(3n) { animation-delay: -1.6s }
@keyframes wave { 0%,100% { transform: skewY(0) } 50% { transform: skewY(-4deg) } }
@media (prefers-reduced-motion: reduce) { .pole img { animation: none } }

.modes { display: grid; gap: 12px; }
.mode { text-align: left; display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.mode:hover { border-color: var(--accent); }
.mode .no { font-family: var(--display); font-size: 30px; color: var(--accent); text-align: center; }
.mode b { display: block; font-size: 18px; }
.mode span { color: var(--sub); font-size: 14px; }

/* ---- 設定 */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.link { background: none; border: 0; color: var(--accent); padding: 8px 0; font-weight: 700; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 700; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--sub); font-family: var(--mono); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.level-desc { font-size: 13px; color: var(--sub); margin: 0; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); padding: 14px 18px; font-weight: 700; font-size: 17px; width: 100%; }
.primary:disabled { opacity: .4; cursor: default; }
.secondary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; font-weight: 700; width: 100%; }
.best { font-size: 13px; color: var(--sub); }
.note { font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }

/* ---- 出題 */
.progress { display: grid; gap: 6px; }
.progress .track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--accent); transition: width .3s; }
.stage { display: grid; gap: 16px; justify-items: center; }
/* 国旗は枠いっぱいに縦横比を保って収め、余白は透明のまま。輪郭は国旗の形に沿った細い影で出す(白い国旗用) */
.flag { display: block; max-width: 100%; object-fit: contain; filter: var(--flag-edge); }
.flag.big { width: min(100%, 320px); height: 200px; }
.prompt { font-size: 14px; color: var(--sub); text-align: center; margin: 0; }
.target-name { font-family: var(--display); font-size: clamp(26px, 8vw, 38px); text-align: center; line-height: 1.2; }
.choices { display: grid; gap: 10px; width: 100%; }
.choice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; text-align: left; font-weight: 500; font-size: 17px; min-width: 0; }
.choice.long { font-size: 15px; font-weight: 400; line-height: 1.55; }
.choice.ok { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
.choice.ng { border-color: var(--ng); box-shadow: inset 0 0 0 2px var(--ng); }
.choice:disabled { cursor: default; color: var(--ink); }
.choices.flags { grid-template-columns: 1fr 1fr; }
.choices.flags .choice { padding: 10px; display: grid; place-items: center; min-height: 104px; }
.choices.flags img { width: 100%; height: 84px; object-fit: contain; filter: var(--flag-edge); }
.statement { margin: 0; width: 100%; box-sizing: border-box; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); font-size: 16px; line-height: 1.75; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ox .choice { text-align: center; font-size: 40px; line-height: 1; padding: 16px 0; font-weight: 700; }
.fix del { color: var(--ng); }
.fix ins { color: var(--ok); text-decoration: none; font-weight: 700; }
.answer-form { display: grid; gap: 10px; width: 100%; }
.answer-form input { font: inherit; font-size: 20px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
.verdict { width: 100%; border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); }
.verdict b { font-size: 18px; }
.verdict.ok b { color: var(--ok); } .verdict.ng b { color: var(--ng); }
.verdict p { margin: 0; font-size: 14px; }
.verdict a { color: var(--accent); }

/* ---- 場所あて */
.map-q { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.map-q .flag { width: 120px; height: 72px; }
.mapbox { position: relative; width: 100%; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sea); touch-action: none; }
.mapbox { height: clamp(260px, calc(100dvh - 330px), 640px); }
.mapbox svg { display: block; width: 100%; height: 100%; max-width: 100%; }
.mapbox .zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.mapbox .zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; }
.country { fill: var(--land); stroke: var(--border); vector-effect: non-scaling-stroke; stroke-width: .6; cursor: pointer; }
.country.off { fill: var(--land-off); cursor: default; }
.country.pick, .dot.pick { fill: var(--pick); }
.country.ok, .dot.ok { fill: var(--ok); }
.country.ng, .dot.ng { fill: var(--ng); }
.dot { fill: var(--land); stroke: var(--border); vector-effect: non-scaling-stroke; stroke-width: 1; cursor: pointer; }
.ring { fill: none; stroke: var(--ok); vector-effect: non-scaling-stroke; stroke-width: 2.5; pointer-events: none; }
.map-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; }

/* ---- 結果 */
.score { display: grid; justify-items: center; gap: 4px; padding-block: 12px; }
.score .big { font-family: var(--display); font-size: 64px; line-height: 1; }
.misses { display: grid; gap: 8px; width: 100%; }
.miss { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.miss img { width: 64px; height: 44px; object-fit: contain; filter: var(--flag-edge); }
.miss p { margin: 0; font-size: 13px; color: var(--sub); }
.stack { display: grid; gap: 10px; width: 100%; }
.loading { text-align: center; color: var(--sub); padding: 40px 0; }
</style>

<div id="app"><p class="loading">読み込み中…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="app.js"></script>
